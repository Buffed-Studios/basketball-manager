name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          # Allow pushing to the local HTTP registry
          buildkitd-config-inline: |
            [registry."192.168.1.218:8080"]
              http = true
              insecure = true

      - name: Login to Zot registry
        uses: docker/login-action@v3
        with:
          registry: 192.168.1.218:8080
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          sbom: false
          tags: |
            192.168.1.218:8080/basketball-manager:latest
            192.168.1.218:8080/basketball-manager:${{ github.sha }}
